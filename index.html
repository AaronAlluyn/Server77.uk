<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server77</title>
    <meta name="description" content="Server77 - Home Server & Infrastructure">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <style>
        :root {
            --bg-color: #0b0d11;
            --card-bg: rgba(18, 22, 29, 0.7);
            --text-main: #f3f4f6;
            --text-faded: #4b5563;
            --text-subtle: #6b7280;
            --accent: #38bdf8;
            --border-color: rgba(255, 255, 255, 0.08);
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.04) 0%, transparent 60%);
        }

        /* Top Header */
        header {
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
        }

        /* Center Body */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .faded-text {
            font-size: clamp(1.25rem, 3vw, 1.75rem);
            font-weight: 400;
            color: var(--text-faded);
            letter-spacing: 0.15em;
            text-transform: lowercase;
            user-select: none;
            transition: color 0.3s ease;
        }

        .faded-text:hover {
            color: var(--text-subtle);
        }

        /* Footer */
        footer {
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .copyright {
            font-size: 0.875rem;
            color: var(--text-faded);
        }

        .social-links {
            display: flex;
            gap: 1.25rem;
            align-items: center;
        }

        .social-links a {
            color: var(--text-faded);
            text-decoration: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-links a:hover {
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .social-links svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        @media (max-width: 640px) {
            header, footer {
                padding: 1.25rem 1.5rem;
            }
            footer {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="/" class="logo">
            <span class="status-dot"></span>
            Server77
        </a>
    </header>

    <!-- Center Content -->
    <main>
        <p class="faded-text">nothing to see here</p>
    </main>

    <!-- Footer -->
    <footer>
        <div class="copyright">
            &copy; 2026 Server77
        </div>
        <div class="social-links">
            <!-- X (Twitter) -->
            <a href="https://x.com" target="_blank" rel="noopener noreferrer" aria-label="Twitter / X">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
            </a>
            <!-- LinkedIn -->
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.21a1.66 1.66 0 0 0-1.66 1.66 1.66 1.66 0 0 0 1.66 1.66 1.66 1.66 0 0 0 1.66-1.66 1.66 1.66 0 0 0-1.66-1.66"/>
                </svg>
            </a>
        </div>
    </footer>

</body>
</html>
